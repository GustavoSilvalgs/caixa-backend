spring:
  application:
    name: caixa-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caixa_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:1234567}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:caixa-sistema-jwt-secret-key-super-segura-2024-development}
  expiration: 86400000
