spring:
  application:
    name: caixa-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/caixa_db
    username: postgres
    password: 1234567
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: 123456
  expiration: 86400000